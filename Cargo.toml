[workspace]
resolver = "2"
members = [
    "crates/autolisp-lsp",
    "crates/autolisp-validate",
    "crates/autocad-diagnostics",
    "crates/autocad-mcp",
    "crates/autocad-reader",
    "crates/autocad-writer",
    "crates/distribution/approval",
    "crates/distribution/evidence",
    "crates/distribution/packager",
    "crates/distribution/plugin-validation",
    "crates/distribution/qualification",
    "crates/xtask",
]

[workspace.package]
license = "GPL-3.0-or-later"

[workspace.dependencies]
jsonschema = { version = "0.46", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[workspace.metadata.cargo-core]
schema-version = 2
retained-workspace-packages = ["autocad-reader"]
max-retained-bytes = 3221225472

[profile.source-validation]
inherits = "test"
debug = 0
incremental = true

[profile.source-validation.package."*"]
opt-level = 3
codegen-units = 16
