[package]
name = "autocad-mcp"
version = "0.0.1"
edition = "2021"
license.workspace = true
description = "AutoCAD MCP server — DWG/DXF read via acadrust, accoreconsole for DWG write"
publish = false

[package.metadata.local-gate]
schema-version = 1

[[package.metadata.local-gate.profiles]]
name = "xref-certification-failpoints"
features = ["xref-certification-failpoints"]
clippy = true
test = false
targets = ["lib", "bin:autocad-mcp"]

[[package.metadata.local-gate.profiles]]
name = "preview"
features = ["preview"]
clippy = true
test = true

[features]
default = []
preview = []
xref-certification-failpoints = []

[dependencies]
acadrust = "=0.4.1"
anyhow = "1"
autocad-reader = { path = "../autocad-reader" }
autocad-writer = { path = "../autocad-writer" }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "autocad-mcp"
path = "src/main.rs"

[dev-dependencies]
walkdir.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[build-dependencies]
sha2.workspace = true

[[test]]
name = "corpus_validation"
path = "../../tests/corpus_validation.rs"
