[package]
name = "autolisp-lsp"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "AutoLISP language server for the AutoCAD MCP plugin"
publish = false

[dependencies]
autolisp-validate = { path = "../autolisp-validate" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "autolisp-lsp"
path = "src/main.rs"
