[package]
name = "release-qualification"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Mode-neutral canonical signed-statement verification primitives"
publish = false

[package.metadata.local-gate]
schema-version = 1

[[package.metadata.local-gate.profiles]]
name = "signing"
features = ["signing"]
clippy = true
test = true

[features]
default = []
signing = [
    "ed25519-dalek/signature",
    "ed25519-dalek/zeroize",
]

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
serde.workspace = true
serde_jcs = "=0.2.0"
serde_json.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = [
    "signature",
    "std",
    "zeroize",
] }
