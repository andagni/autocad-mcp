[package]
name = "distribution-evidence"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Deterministic source-closure and third-party licence evidence generation for AutoCAD MCP distributions"
publish = false

[package.metadata.local-gate]
schema-version = 1

[[package.metadata.local-gate.checks]]
name = "distribution-evidence"
bin = "distribution-evidence"
arguments = ["check"]
content-receipt = "distribution-evidence"

[lib]
name = "distribution_evidence"
path = "src/lib.rs"

[[bin]]
name = "distribution-evidence"
path = "src/main.rs"

[dependencies]
distribution-approval = { path = "../approval" }
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
