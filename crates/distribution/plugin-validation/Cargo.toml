[package]
name = "plugin-validate"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Dev ship-gate: validate plugin/ documents against path-matched JSON Schemas and check directory structure"
publish = false

[dependencies]
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "plugin-validate"
path = "src/main.rs"
