[package]
name = "distribution-approval"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
release-qualification = { path = "../qualification" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.46", default-features = false }
release-qualification = { path = "../qualification", features = ["signing"] }
