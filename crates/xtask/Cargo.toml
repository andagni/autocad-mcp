[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
license.workspace = true
description = "Repository-owned development automation for AutoCAD MCP"
publish = false
default-run = "xtask"

[features]
default = ["full"]
full = [
    "dep:anyhow",
    "dep:autocad-mcp",
    "dep:distribution-approval",
    "dep:distribution-evidence",
    "dep:flate2",
    "dep:object",
    "dep:release-packager",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tempfile",
]

[[bin]]
name = "xtask"
path = "src/main.rs"
required-features = ["full"]

[[bin]]
name = "pre-push-dispatch"
path = "src/pre_push_dispatch.rs"

[dependencies]
anyhow = { version = "1", optional = true }
autocad-mcp = { path = "../autocad-mcp", optional = true }
distribution-approval = { path = "../distribution/approval", optional = true }
distribution-evidence = { path = "../distribution/evidence", optional = true }
flate2 = { version = "1", optional = true }
object = { version = "=0.39.1", default-features = false, features = ["read_core", "pe"], optional = true }
release-packager = { path = "../distribution/packager", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
plugin-validate = { path = "../distribution/plugin-validation" }
proc-macro2 = "1"
semver = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir.workspace = true

[[test]]
name = "repository_policy"
path = "../../tests/repository_policy.rs"
