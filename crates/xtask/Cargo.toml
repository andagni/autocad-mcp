[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
license.workspace = true
description = "Repository-owned development automation for AutoCAD MCP"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
autocad-mcp = { path = "../autocad-mcp" }
distribution-approval = { path = "../distribution/approval" }
distribution-evidence = { path = "../distribution/evidence" }
flate2 = "1"
object = { version = "=0.39.1", default-features = false, features = ["read_core", "pe"] }
release-packager = { path = "../distribution/packager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
plugin-validate = { path = "../distribution/plugin-validation" }
proc-macro2 = "1"
semver = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"

[[test]]
name = "repository_policy"
path = "../../tests/repository_policy.rs"
