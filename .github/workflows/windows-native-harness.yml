name: Windows-only semantic extension

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .gitattributes
      - .github/workflows/windows-native-harness.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - plugin/**
      - rust-toolchain.toml
      - tests/fixtures/**
  push:
    branches:
      - main
    paths:
      - .gitattributes
      - .github/workflows/windows-native-harness.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - plugin/**
      - rust-toolchain.toml
      - tests/fixtures/**

permissions:
  contents: read

jobs:
  windows-native-harness:
    name: Windows-only non-AutoCAD evidence
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checkout bytes without ambient Git configuration
        shell: pwsh
        run: $env:GIT_CONFIG_NOSYSTEM = "1"; $env:GIT_CONFIG_SYSTEM = "NUL"; $env:GIT_CONFIG_GLOBAL = "NUL"; $env:GIT_ATTR_NOSYSTEM = "1"; $status = @(git status --porcelain=v1 --untracked-files=all); if ($LASTEXITCODE -ne 0) { throw "isolated Git status failed" }; if ($status.Count -ne 0) { $status | Write-Error; throw "checkout bytes depend on ambient Git configuration" }

      - name: Install the repository toolchain
        run: rustup toolchain install --no-self-update

      - name: Install the pinned shared compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.15.0"

      - name: Bind the hosted Windows image for validation receipts
        id: windows-receipt-context
        shell: pwsh
        run: $bytes = [Text.Encoding]::UTF8.GetBytes("$env:ImageOS`n$env:ImageVersion`n$env:RUNNER_OS`n$env:RUNNER_ARCH"); $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant(); "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore the shared locked Cargo dependency cache
        id: cargo-dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-windows-2025-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-v1-windows-2025-${{ runner.arch }}-

      - name: Populate the exact locked dependency sources
        run: cargo fetch --locked

      - name: Save the trusted main dependency cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-dependencies.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-v1-windows-2025-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

      - name: Restore an exact main-authored Windows semantic receipt
        id: windows-semantic-receipt
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/local-ci-receipts/v1/windows-native-semantic
          key: windows-semantic-receipt-v1-windows-2025-${{ runner.arch }}-${{ steps.windows-receipt-context.outputs.sha256 }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**', 'tests/fixtures/**', '.github/workflows/windows-native-harness.yml') }}

      - name: Run the repository-owned Windows semantic tests
        id: windows_semantic
        continue-on-error: true
        run: cargo run --locked -p xtask -- windows-native-tests --suite semantic --content-receipt

      - name: Save the trusted main Windows semantic receipt
        if: ${{ always() && steps.windows_semantic.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.windows-semantic-receipt.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target/local-ci-receipts/v1/windows-native-semantic
          key: windows-semantic-receipt-v1-windows-2025-${{ runner.arch }}-${{ steps.windows-receipt-context.outputs.sha256 }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**', 'tests/fixtures/**', '.github/workflows/windows-native-harness.yml') }}

      - name: Seal the deterministic Windows target source candidate
        id: windows_source_candidate
        continue-on-error: true
        run: cargo run --locked -p xtask -- source-candidate-seal --output-dir target/windows-source-candidate --mode preview

      - name: Build and inspect the native Release, instrumented, and Preview binaries
        id: windows_build
        continue-on-error: true
        run: cargo run --locked -p xtask -- windows-certification-build-preflight --arg tests/fixtures/windows_certification/public-development-profile.arg --arg-policy tests/fixtures/windows_certification/public-development-arg-policy.json --output-dir target/windows-certification-preflight

      - name: Exercise the exact ARG-bound release binary through the Claude Desktop lifecycle
        id: desktop_smoke
        if: ${{ always() && steps.windows_build.outcome == 'success' }}
        continue-on-error: true
        run: cargo run --locked -p release-packager -- desktop-smoke --binary target/windows-certification-preflight/artifacts/release/autocad-mcp.exe --fixture tests/fixtures/xrefs/portable-evidence-ascii.dxf

      - name: Exercise the exact staged AutoLISP language server
        id: lsp_smoke
        if: ${{ always() && steps.windows_build.outcome == 'success' }}
        continue-on-error: true
        run: cargo run --locked -p release-packager -- lsp-smoke --binary target/windows-certification-preflight/artifacts/release/autolisp-lsp.exe

      - name: Build the visibly marked Preview MCPB
        id: preview_package
        if: ${{ always() && steps.windows_build.outcome == 'success' }}
        continue-on-error: true
        run: cargo run --locked -p release-packager -- package --target windows-x64 --binary target/windows-certification-preflight/artifacts/preview/autocad-mcp.exe --lsp-binary target/windows-certification-preflight/artifacts/release/autolisp-lsp.exe --out-dir target/windows-preview-package --preview

      - name: Smoke the Preview package, LSP, and experimental tool surface
        id: preview_package_smoke
        if: ${{ always() && steps.preview_package.outcome == 'success' }}
        continue-on-error: true
        run: cargo run --locked -p release-packager -- smoke --package target/windows-preview-package/autocad-mcp-windows-x64-preview.mcpb --fixture tests/fixtures/xrefs/portable-evidence-ascii.dxf --require-executable --require-lsp-executable

      - name: Require every runnable Windows validation
        if: ${{ always() }}
        shell: pwsh
        env:
          WINDOWS_SEMANTIC_OUTCOME: ${{ steps.windows_semantic.outcome }}
          WINDOWS_SOURCE_CANDIDATE_OUTCOME: ${{ steps.windows_source_candidate.outcome }}
          WINDOWS_BUILD_OUTCOME: ${{ steps.windows_build.outcome }}
          DESKTOP_SMOKE_OUTCOME: ${{ steps.desktop_smoke.outcome }}
          LSP_SMOKE_OUTCOME: ${{ steps.lsp_smoke.outcome }}
          PREVIEW_PACKAGE_OUTCOME: ${{ steps.preview_package.outcome }}
          PREVIEW_PACKAGE_SMOKE_OUTCOME: ${{ steps.preview_package_smoke.outcome }}
        run: |
          $failures = @()
          if ($env:WINDOWS_SEMANTIC_OUTCOME -cne "success") {
            $failures += "Windows semantic validation"
          }
          if ($env:WINDOWS_SOURCE_CANDIDATE_OUTCOME -cne "success") {
            $failures += "Preview source-candidate sealing"
          }
          if ($env:WINDOWS_BUILD_OUTCOME -cne "success") {
            $failures += "Release, instrumented, and Preview binary build"
          } else {
            if ($env:DESKTOP_SMOKE_OUTCOME -cne "success") {
              $failures += "Claude Desktop binary lifecycle smoke"
            }
            if ($env:LSP_SMOKE_OUTCOME -cne "success") {
              $failures += "AutoLISP LSP lifecycle smoke"
            }
            if ($env:PREVIEW_PACKAGE_OUTCOME -cne "success") {
              $failures += "Preview MCPB construction"
            } elseif ($env:PREVIEW_PACKAGE_SMOKE_OUTCOME -cne "success") {
              $failures += "Preview MCPB smoke"
            }
          }
          if ($failures.Count -ne 0) {
            foreach ($failure in $failures) {
              Write-Host "::error title=Windows validation failure::$failure"
            }
            throw "$($failures.Count) Windows validation stage(s) failed: $($failures -join '; ')"
          }
